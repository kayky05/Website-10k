<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Website 10k: a skill que cria landing pages de nível agência com IA">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17181b"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.78" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#356EF3" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#356EF3" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#356EF3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tela" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="0.55" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="horizonte" cx="0.5" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#5A8BFF" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#356EF3" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#356EF3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#356EF3" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#7EA6FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#356EF3" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <clipPath id="recorte"><rect x="742" y="92" width="452" height="254" rx="10"/></clipPath>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#fundo)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grade)"/>
  <rect width="1280" height="440" rx="24" fill="url(#luz)"/>

  <!-- texto -->
  <text x="84" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#9C9EA4">SKILL PARA CLAUDE CODE · CODEX · CURSOR</text>
  <text x="80" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="96" letter-spacing="-3" fill="#EEF1F7">Website</text>
  <text x="80" y="306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="96" letter-spacing="-3" fill="#356EF3">10k</text>
  <text x="262" y="306" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#C9CCD3">nível agência</text>
  <text x="84" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#9C9EA4">Landing pages com cenas em vídeo que tocam com a rolagem,</text>
  <text x="84" y="388" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#9C9EA4">feitas pela sua IA, do briefing ao domínio.</text>

  <!-- janela do navegador com a cena -->
  <g>
    <rect x="726" y="60" width="484" height="302" rx="16" fill="#121315" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="748" cy="77" r="4.5" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="764" cy="77" r="4.5" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="780" cy="77" r="4.5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="904" y="70" width="128" height="14" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <g clip-path="url(#recorte)">
      <rect x="742" y="92" width="452" height="254" fill="url(#tela)"/>
      <rect x="742" y="92" width="452" height="254" fill="url(#horizonte)"/>
      <!-- estrelas e cidades -->
      <g fill="#cfe0ff">
        <circle cx="790" cy="120" r="1.2" opacity="0.7"/><circle cx="860" cy="140" r="1" opacity="0.5"/>
        <circle cx="1120" cy="118" r="1.3" opacity="0.6"/><circle cx="1160" cy="160" r="1" opacity="0.4"/>
        <circle cx="1010" cy="128" r="0.9" opacity="0.5"/><circle cx="930" cy="110" r="1.1" opacity="0.6"/>
      </g>
      <path d="M742 330 C 860 296, 1080 296, 1194 330 L1194 346 L742 346 Z" fill="#05070c"/>
      <path d="M742 330 C 860 296, 1080 296, 1194 330" fill="none" stroke="#7EA6FF" stroke-opacity="0.7" stroke-width="1.5"/>
      <g fill="#ffd9a0">
        <circle cx="880" cy="318" r="1.6" opacity="0.8"/><circle cx="905" cy="314" r="1.2" opacity="0.7"/>
        <circle cx="968" cy="309" r="1.8" opacity="0.9"/><circle cx="1002" cy="310" r="1.2" opacity="0.6"/>
        <circle cx="1044" cy="313" r="1.5" opacity="0.8"/><circle cx="1090" cy="318" r="1.1" opacity="0.6"/>
      </g>
    </g>
    <!-- símbolo genérico que se desenha (abertura de marca) -->
    <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M968 168 m-30 0 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0" stroke="#5A8BFF" opacity="0.45" filter="url(#brilho)"/>
      <path d="M968 168 m-30 0 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0" stroke="#356EF3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.001;0.241;1" dur="6s" repeatCount="indefinite"/></path>
      <path d="M950 186 L968 150 L986 186 Z" stroke="#EEF1F7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.061;0.301;1" dur="6s" repeatCount="indefinite"/></path>
      <path d="M920 230 H1016" stroke="#EEF1F7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.121;0.361;1" dur="6s" repeatCount="indefinite"/></path>
    </g>
    <text x="968" y="256" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="3" fill="#EEF1F7" fill-opacity="0.75">ABERTURA DE MARCA</text>
    <!-- trilho de rolagem -->
    <rect x="1202" y="104" width="3" height="230" rx="1.5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="1202" y="104" width="3" height="60" rx="1.5" fill="#356EF3">
      <animate attributeName="y" values="104;274;104" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.6;1" keySplines="0.16 1 0.3 1;0.4 0 0.2 1"/>
    </rect>
  </g>

  <!-- fio de luz -->
  <path id="trilho" d="M640 410 C 820 360, 960 420, 1120 380 S 1240 360, 1300 370" fill="none" stroke="url(#fio)" stroke-width="2" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900">
    <animate attributeName="stroke-dashoffset" values="900;0;0" keyTimes="0;0.55;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1"/>
  </path>
</svg>
